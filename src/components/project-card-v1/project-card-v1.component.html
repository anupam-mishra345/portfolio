<div
  class="project w-full flex flex-col cursor-pointer transition-effect h-[600px]"
  [ngClass]="isDarkMode ? 'text-light bg-dark' : 'text-dark bg-light'"
  (click)="navigateTo(project.id)"
  [style.--project-image]="'url(' + project.projectMockup + ')'"
>
  <div
    class="index m-auto text-light stroke-dark text-[200px] font-bold transition-effect"
  >
    {{ index + 1 }}
  </div>
  <div class="flex mt-auto p-2">
    <div
      *ngIf="project.projectName !== 'Real-Estate'"
      class="logo h-[50px] w-[50px] flex self-center"
    >
      <img
        [src]="project.logo"
        class="self-center"
        [alt]="project.projectName + ' logo'"
        height="50px"
        width="50px"
      />
    </div>
    <div
      *ngIf="project.projectName === 'Real-Estate'"
      class="logo h-[40px] w-[40px] flex self-center mt-[5px] mb-[5px]"
    >
      <img
        [src]="project.logo"
        class="self-center"
        alt="logo"
        height="40px"
        width="40px"
      />
    </div>
    <h3
      class="project-name text-light cursor-pointer self-center pl-3 transition-effect"
    >
      {{ project.projectName }}
    </h3>
    <div class="active-text ml-auto self-center mr-5">{{ project.year }}</div>
  </div>
</div>
